<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXO · Asistente virtual de la maestra Anita</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .contenedor {
      width: 92%;
      max-width: 1000px;
    }

    h1 {
      font-size: 64px;
      letter-spacing: 12px;
      margin: 0 0 10px;
    }

    h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 400;
    }

    .subtitulo {
      margin-top: 14px;
      color: #aabbd3;
      font-size: 16px;
    }

    .panel {
      margin-top: 50px;
      padding: 30px;

      background: rgba(20, 40, 70, 0.75);

      border: 1px solid #48aaff;
      border-radius: 28px;

      box-shadow:
        0 0 35px rgba(0, 130, 255, 0.15);
    }

    canvas {
      width: 100%;
      height: 160px;
      display: block;
    }

    button {
      margin-top: 20px;

      width: 82px;
      height: 82px;

      border-radius: 50%;
      border: 2px solid #63c7ff;

      background: #102d50;
      color: white;

      font-size: 32px;
      cursor: pointer;

      box-shadow:
        0 0 25px rgba(70, 190, 255, 0.4);
    }

    #estado {
      margin-top: 18px;

      font-size: 25px;
      font-weight: bold;

      letter-spacing: 5px;
    }

    #instruccion {
      margin-top: 10px;
      color: #b7c8dc;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>NEXO</h1>

  <h2>
    Asistente virtual de la maestra Anita
  </h2>

  <div class="subtitulo">
    Acompañamiento pedagógico fundamentado en documentos oficiales
  </div>

  <div class="panel">

    <canvas id="onda"></canvas>

    <button id="microfono">
      🎙️
    </button>

    <div id="estado">
      EN ESPERA
    </div>

    <div id="instruccion">
      Toca el micrófono una vez para activar NEXO
    </div>

  </div>

</div>


<script>

/* =============================
   ELEMENTOS
============================= */

const boton =
  document.getElementById("microfono");

const estado =
  document.getElementById("estado");

const instruccion =
  document.getElementById("instruccion");

const canvas =
  document.getElementById("onda");

const ctx =
  canvas.getContext("2d");


/* =============================
   VARIABLES
============================= */

let audioContext;
let analyser;
let dataArray;

let microfonoPreparado = false;

let sistemaActivo = false;

let nexoHablando = false;

let esperandoPregunta = false;

let vozNexo = null;

let temporizadorReinicio = null;


/* =============================
   CANVAS
============================= */

function ajustarCanvas() {

  canvas.width =
    canvas.clientWidth * devicePixelRatio;

  canvas.height =
    canvas.clientHeight * devicePixelRatio;
}

ajustarCanvas();

window.addEventListener(
  "resize",
  ajustarCanvas
);


/* =============================
   ONDA
============================= */

function dibujarOnda() {

  requestAnimationFrame(
    dibujarOnda
  );


  const ancho =
    canvas.width;

  const alto =
    canvas.height;


  ctx.clearRect(
    0,
    0,
    ancho,
    alto
  );


  ctx.beginPath();

  ctx.lineWidth =
    3 * devicePixelRatio;


  if (
    !sistemaActivo ||
    !analyser
  ) {

    ctx.strokeStyle =
      "#4aaeff";

    ctx.moveTo(
      0,
      alto / 2
    );

    ctx.lineTo(
      ancho,
      alto / 2
    );

    ctx.stroke();

    return;
  }


  analyser.getByteTimeDomainData(
    dataArray
  );


  if (nexoHablando) {

    ctx.strokeStyle =
      "#f3c969";

    ctx.shadowColor =
      "#dcae46";

  } else {

    ctx.strokeStyle =
      "#54d9ff";

    ctx.shadowColor =
      "#24aaff";
  }


  ctx.shadowBlur =
    14 * devicePixelRatio;


  const slice =
    ancho / dataArray.length;


  let x = 0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    const v =
      dataArray[i] / 128;

    const y =
      v * alto / 2;


    if (i === 0) {

      ctx.moveTo(
        x,
        y
      );

    } else {

      ctx.lineTo(
        x,
        y
      );
    }


    x += slice;
  }


  ctx.stroke();

  ctx.shadowBlur = 0;
}


/* =============================
   MICRÓFONO
============================= */

async function prepararMicrofono() {

  if (microfonoPreparado) {

    return true;
  }


  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    analyser =
      audioContext.createAnalyser();


    analyser.fftSize =
      2048;


    const source =
      audioContext
        .createMediaStreamSource(
          stream
        );


    source.connect(
      analyser
    );


    dataArray =
      new Uint8Array(
        analyser.fftSize
      );


    microfonoPreparado =
      true;


    return true;


  } catch (error) {

    estado.textContent =
      "MICRÓFONO NO DISPONIBLE";

    instruccion.textContent =
      "Revisa el permiso del navegador";

    return false;
  }
}


/* =============================
   NORMALIZAR TEXTO
============================= */

function normalizar(texto) {

  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


/* =============================
   ELEGIR VOZ
============================= */

function cargarVoces() {

  const voces =
    window.speechSynthesis
      .getVoices();


  if (!voces.length) {

    return;
  }


  const vocesMexico =
    voces.filter(
      voz =>
        voz.lang
          .toLowerCase()
          .startsWith("es-mx")
    );


  /*
    INTENTAMOS ENCONTRAR
    NOMBRES COMUNES DE VOCES
    MASCULINAS
  */

  const nombresMasculinos =
    /jorge|raul|raúl|diego|pablo|carlos|antonio|andres|andrés|male/i;


  vozNexo =
    vocesMexico.find(
      voz =>
        nombresMasculinos.test(
          voz.name
        )
    );


  /*
    SI NO ENCUENTRA ESA VOZ,
    USA OTRA VOZ DE MÉXICO
  */

  if (!vozNexo) {

    vozNexo =
      vocesMexico[0];
  }


  /*
    DESPUÉS BUSCAMOS
    ESPAÑOL MASCULINO
  */

  if (!vozNexo) {

    vozNexo =
      voces.find(
        voz =>
          voz.lang
            .toLowerCase()
            .startsWith("es") &&
          nombresMasculinos.test(
            voz.name
          )
      );
  }


  /*
    ÚLTIMO RECURSO:
    CUALQUIER VOZ EN ESPAÑOL
  */

  if (!vozNexo) {

    vozNexo =
      voces.find(
        voz =>
          voz.lang
            .toLowerCase()
            .startsWith("es")
      );
  }


  console.log(
    "Voz elegida para NEXO:",
    vozNexo
  );
}


cargarVoces();


window.speechSynthesis.onvoiceschanged =
  cargarVoces;


/* =============================
   ESTADO EN ESPERA
============================= */

function mostrarEspera() {

  if (!sistemaActivo) {

    return;
  }


  if (nexoHablando) {

    return;
  }


  if (esperandoPregunta) {

    estado.textContent =
      "ESCUCHANDO…";

    instruccion.textContent =
      "Haz tu pregunta";

    return;
  }


  estado.textContent =
    "EN ESPERA";


  instruccion.textContent =
    'Di "Oye Nexo" para comenzar';
}


/* =============================
   RECONOCIMIENTO
============================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let reconocimiento;


if (SpeechRecognition) {

  reconocimiento =
    new SpeechRecognition();


  reconocimiento.lang =
    "es-MX";


  reconocimiento.continuous =
    false;


  reconocimiento.interimResults =
    false;


  reconocimiento.maxAlternatives =
    1;
}


/* =============================
   INICIAR ESCUCHA
============================= */

function iniciarEscucha() {

  clearTimeout(
    temporizadorReinicio
  );


  if (
    !sistemaActivo ||
    nexoHablando
  ) {

    return;
  }


  try {

    reconocimiento.start();

  } catch (error) {

    temporizadorReinicio =
      setTimeout(
        iniciarEscucha,
        600
      );
  }
}


/* =============================
   HABLAR
============================= */

function hablar(
  texto,
  alTerminar = null
) {

  if (
    !("speechSynthesis" in window)
  ) {

    nexoHablando =
      false;

    if (alTerminar) {

      alTerminar();
    }

    return;
  }


  nexoHablando =
    true;


  clearTimeout(
    temporizadorReinicio
  );


  /*
    DETENEMOS EL OÍDO
    MIENTRAS HABLA
  */

  try {

    reconocimiento.abort();

  } catch (error) {}


  estado.textContent =
    "RESPONDIENDO";


  instruccion.textContent =
    "NEXO está hablando";


  window.speechSynthesis
    .cancel();


  window.speechSynthesis
    .resume();


  const mensaje =
    new SpeechSynthesisUtterance(
      texto
    );


  mensaje.lang =
    "es-MX";


  mensaje.rate =
    0.94;


  mensaje.pitch =
    0.88;


  mensaje.volume =
    1;


  if (vozNexo) {

    mensaje.voice =
      vozNexo;
  }


  mensaje.onstart = () => {

    console.log(
      "NEXO comenzó a hablar"
    );
  };


  mensaje.onend = () => {

    console.log(
      "NEXO terminó de hablar"
    );


    nexoHablando =
      false;


    if (alTerminar) {

      alTerminar();

      return;
    }


    mostrarEspera();


    setTimeout(
      iniciarEscucha,
      700
    );
  };


  mensaje.onerror = (event) => {

    console.log(
      "Error en voz:",
      event.error
    );


    nexoHablando =
      false;


    if (alTerminar) {

      alTerminar();

      return;
    }


    mostrarEspera();


    setTimeout(
      iniciarEscucha,
      700
    );
  };


  setTimeout(() => {

    window.speechSynthesis
      .speak(
        mensaje
      );

  }, 120);
}


/* =============================
   PROCESAR PREGUNTA
============================= */

function procesarPregunta(
  pregunta
) {

  pregunta =
    pregunta.trim();


  if (!pregunta) {

    esperandoPregunta =
      true;

    mostrarEspera();

    iniciarEscucha();

    return;
  }


  esperandoPregunta =
    false;


  console.log(
    "Pregunta para NEXO:",
    pregunta
  );


  estado.textContent =
    "PREGUNTA RECIBIDA";


  instruccion.textContent =
    "Preparando respuesta";


  /*
    RESPUESTA TEMPORAL.

    MÁS ADELANTE AQUÍ
    CONECTAREMOS EL CEREBRO
    DOCUMENTAL DE NEXO.
  */

  setTimeout(() => {

    hablar(
      "He recibido tu pregunta. Estoy listo para consultar mis fuentes."
    );

  }, 500);
}


/* =============================
   CUANDO ESCUCHA ALGO
============================= */

if (SpeechRecognition) {

  reconocimiento.onstart = () => {

    mostrarEspera();
  };


  reconocimiento.onresult =
    (event) => {


      if (nexoHablando) {

        return;
      }


      const textoOriginal =
        event.results[0][0]
          .transcript;


      const texto =
        normalizar(
          textoOriginal
        );


      console.log(
        "Voz detectada:",
        textoOriginal
      );


      /*
        SI NEXO YA DIJO:
        "ESTOY LISTO PARA
        RECIBIR TU PREGUNTA"

        LA SIGUIENTE FRASE
        ES LA PREGUNTA.
      */

      if (esperandoPregunta) {

        procesarPregunta(
          textoOriginal
        );

        return;
      }


      /*
        SI NO ESTAMOS ESPERANDO
        PREGUNTA, BUSCAMOS NEXO.
      */

      const posicionNexo =
        texto.indexOf(
          "nexo"
        );


      if (
        posicionNexo === -1
      ) {

        mostrarEspera();

        return;
      }


      /*
        ESCUCHÓ NEXO.

        REVISAMOS SI LA PREGUNTA
        YA VIENE EN LA MISMA FRASE.
      */

      let pregunta =
        textoOriginal.substring(
          posicionNexo + 4
        );


      pregunta =
        pregunta
          .replace(
            /^[\s,.:;!?¿¡-]+/,
            ""
          )
          .trim();


      /*
        EJEMPLO:

        "OYE NEXO,
        QUÉ ES EL PROGRAMA ANALÍTICO"
      */

      if (
        pregunta.length >= 3
      ) {

        procesarPregunta(
          pregunta
        );

        return;
      }


      /*
        EJEMPLO:

        "OYE NEXO"

        NEXO RESPONDE Y
        DESPUÉS ESPERA
        LA PREGUNTA.
      */

      esperandoPregunta =
        true;


      hablar(
        "Estoy listo para recibir tu pregunta.",
        () => {

          nexoHablando =
            false;


          esperandoPregunta =
            true;


          estado.textContent =
            "ESCUCHANDO…";


          instruccion.textContent =
            "Haz tu pregunta";


          setTimeout(
            iniciarEscucha,
            600
          );
        }
      );
    };


  reconocimiento.onerror =
    (event) => {


      console.log(
        "Error reconocimiento:",
        event.error
      );


      if (
        event.error ===
          "not-allowed" ||
        event.error ===
          "service-not-allowed" ||
        event.error ===
          "audio-capture"
      ) {

        sistemaActivo =
          false;


        estado.textContent =
          "ERROR DE VOZ";


        instruccion.textContent =
          "Revisa el micrófono";


        return;
      }
    };


  reconocimiento.onend =
    () => {


      if (
        !sistemaActivo ||
        nexoHablando
      ) {

        return;
      }


      temporizadorReinicio =
        setTimeout(
          iniciarEscucha,
          500
        );
    };
}


/* =============================
   BOTÓN
============================= */

boton.addEventListener(
  "click",
  async () => {


    /*
      APAGAR NEXO
    */

    if (sistemaActivo) {

      sistemaActivo =
        false;


      esperandoPregunta =
        false;


      nexoHablando =
        false;


      clearTimeout(
        temporizadorReinicio
      );


      window.speechSynthesis
        .cancel();


      try {

        reconocimiento.abort();

      } catch (error) {}


      estado.textContent =
        "EN ESPERA";


      instruccion.textContent =
        "Toca el micrófono para comenzar";


      return;
    }


    /*
      ACTIVAR NEXO
    */

    estado.textContent =
      "PREPARANDO…";


    instruccion.textContent =
      "Activando NEXO";


    const preparado =
      await prepararMicrofono();


    if (!preparado) {

      return;
    }


    if (!SpeechRecognition) {

      estado.textContent =
        "RECONOCIMIENTO NO DISPONIBLE";


      instruccion.textContent =
        "Utiliza Google Chrome";


      return;
    }


    sistemaActivo =
      true;


    esperandoPregunta =
      false;


    /*
      ACTIVAMOS EL MOTOR
      DE VOZ DESDE EL CLIC
    */

    hablar(
      "Nexo activado.",
      () => {

        nexoHablando =
          false;


        mostrarEspera();


        setTimeout(
          iniciarEscucha,
          600
        );
      }
    );
  }
);


dibujarOnda();

</script>

</body>
</html>
