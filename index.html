<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXO · Asistente virtual de la maestra Anita</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .contenedor {
      width: 92%;
      max-width: 1000px;
    }

    h1 {
      font-size: 64px;
      letter-spacing: 12px;
      margin: 0 0 10px;
    }

    h2 {
      margin: 0;
      font-weight: 400;
      font-size: 26px;
    }

    .subtitulo {
      margin-top: 14px;
      color: #aabbd3;
      font-size: 16px;
    }

    .panel {
      margin-top: 50px;
      padding: 30px;

      background: rgba(20, 40, 70, 0.75);

      border: 1px solid #48aaff;
      border-radius: 28px;

      box-shadow:
        0 0 35px rgba(0, 130, 255, 0.15);
    }

    canvas {
      width: 100%;
      height: 160px;

      display: block;

      border-radius: 15px;
    }

    button {
      margin-top: 20px;

      width: 82px;
      height: 82px;

      border-radius: 50%;
      border: 2px solid #63c7ff;

      background: #102d50;
      color: white;

      font-size: 32px;
      cursor: pointer;

      box-shadow:
        0 0 25px rgba(70, 190, 255, 0.4);
    }

    button:hover {
      transform: scale(1.05);
    }

    #estado {
      margin-top: 18px;

      font-size: 25px;
      font-weight: bold;

      letter-spacing: 5px;
    }

    #instruccion {
      margin-top: 10px;
      color: #b7c8dc;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>NEXO</h1>

    <h2>
      Asistente virtual de la maestra Anita
    </h2>

    <div class="subtitulo">
      Acompañamiento pedagógico fundamentado en documentos oficiales
    </div>

    <div class="panel">

      <canvas id="onda"></canvas>

      <button id="microfono" title="Activar micrófono">
        🎙️
      </button>

      <div id="estado">
        EN ESPERA
      </div>

      <div id="instruccion">
        Toca el micrófono para comenzar
      </div>

    </div>

  </div>


<script>

const boton = document.getElementById("microfono");
const estado = document.getElementById("estado");
const instruccion = document.getElementById("instruccion");

const canvas = document.getElementById("onda");
const ctx = canvas.getContext("2d");

let audioContext;
let analyser;
let dataArray;
let microfonoPreparado = false;
let escuchando = false;

let ultimaPregunta = "";


/* ==============================
   AJUSTAR CANVAS
============================== */

function ajustarCanvas() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}

ajustarCanvas();

window.addEventListener("resize", ajustarCanvas);


/* ==============================
   ONDA DE SONIDO
============================== */

function dibujarOnda() {

  requestAnimationFrame(dibujarOnda);

  const ancho = canvas.width;
  const alto = canvas.height;

  ctx.clearRect(0, 0, ancho, alto);

  ctx.shadowBlur = 0;

  if (!escuchando || !analyser) {

    ctx.beginPath();

    ctx.strokeStyle = "#4aaeff";
    ctx.lineWidth = 3 * devicePixelRatio;

    ctx.moveTo(0, alto / 2);
    ctx.lineTo(ancho, alto / 2);

    ctx.stroke();

    return;
  }

  analyser.getByteTimeDomainData(dataArray);

  ctx.beginPath();

  ctx.lineWidth = 3 * devicePixelRatio;
  ctx.strokeStyle = "#54d9ff";

  ctx.shadowColor = "#24aaff";
  ctx.shadowBlur = 16 * devicePixelRatio;

  const sliceWidth = ancho / dataArray.length;

  let x = 0;

  for (let i = 0; i < dataArray.length; i++) {

    const v = dataArray[i] / 128.0;
    const y = v * alto / 2;

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

    x += sliceWidth;
  }

  ctx.lineTo(ancho, alto / 2);
  ctx.stroke();
}


/* ==============================
   PREPARAR MICRÓFONO
============================== */

async function prepararMicrofono() {

  if (microfonoPreparado) return true;

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

    analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;

    const source =
      audioContext.createMediaStreamSource(stream);

    source.connect(analyser);

    dataArray =
      new Uint8Array(analyser.fftSize);

    microfonoPreparado = true;

    return true;

  } catch (error) {

    estado.textContent =
      "MICRÓFONO NO DISPONIBLE";

    instruccion.textContent =
      "Revisa el permiso del navegador";

    return false;
  }
}


/* ==============================
   RECONOCIMIENTO DE VOZ
============================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let reconocimiento;

if (SpeechRecognition) {

  reconocimiento =
    new SpeechRecognition();

  reconocimiento.lang = "es-MX";

  reconocimiento.continuous = false;

  reconocimiento.interimResults = false;


  reconocimiento.onstart = () => {

    escuchando = true;

    estado.textContent =
      "ESCUCHANDO…";

    instruccion.textContent =
      "Haz tu pregunta";
  };


  reconocimiento.onresult = (event) => {

    ultimaPregunta =
      event.results[0][0].transcript;

    /*
      La pregunta queda guardada internamente.
      NO se muestra en pantalla.
    */

    console.log(
      "Pregunta recibida:",
      ultimaPregunta
    );

    estado.textContent =
      "PREGUNTA RECIBIDA";

    instruccion.textContent =
      "NEXO entendió tu pregunta";
  };


  reconocimiento.onerror = () => {

    escuchando = false;

    estado.textContent =
      "NO PUDE ESCUCHARTE";

    instruccion.textContent =
      "Intenta nuevamente";
  };


  reconocimiento.onend = () => {

    escuchando = false;

    setTimeout(() => {

      estado.textContent =
        "EN ESPERA";

      instruccion.textContent =
        "Toca el micrófono para comenzar";

    }, 4000);
  };

}


/* ==============================
   BOTÓN DE MICRÓFONO
============================== */

boton.addEventListener(
  "click",
  async () => {

    const preparado =
      await prepararMicrofono();

    if (!preparado) return;


    if (!SpeechRecognition) {

      estado.textContent =
        "RECONOCIMIENTO NO DISPONIBLE";

      instruccion.textContent =
        "Utiliza Google Chrome";

      return;
    }


    try {

      reconocimiento.start();

    } catch (error) {

      console.log(error);

    }

  }
);


dibujarOnda();

</script>

</body>
</html>
