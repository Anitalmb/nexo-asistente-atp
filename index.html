<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXO · Asistente virtual de la maestra Anita</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .contenedor {
      width: 92%;
      max-width: 1000px;
    }

    h1 {
      font-size: 64px;
      letter-spacing: 12px;
      margin: 0 0 10px;
    }

    h2 {
      margin: 0;
      font-weight: 400;
      font-size: 26px;
    }

    .subtitulo {
      margin-top: 14px;
      color: #aabbd3;
      font-size: 16px;
    }

    .panel {
      margin-top: 50px;
      padding: 30px;
      background: rgba(20, 40, 70, 0.75);
      border: 1px solid #48aaff;
      border-radius: 28px;
      box-shadow: 0 0 35px rgba(0, 130, 255, 0.15);
    }

    canvas {
      width: 100%;
      height: 160px;
      display: block;
      border-radius: 15px;
    }

    button {
      margin-top: 20px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid #63c7ff;
      background: #102d50;
      color: white;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(70, 190, 255, 0.4);
    }

    #estado {
      margin-top: 18px;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    #instruccion {
      margin-top: 10px;
      color: #b7c8dc;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>NEXO</h1>

  <h2>Asistente virtual de la maestra Anita</h2>

  <div class="subtitulo">
    Acompañamiento pedagógico fundamentado en documentos oficiales
  </div>

  <div class="panel">

    <canvas id="onda"></canvas>

    <button id="microfono">🎙️</button>

    <div id="estado">EN ESPERA</div>

    <div id="instruccion">
      Toca el micrófono una vez para activar NEXO
    </div>

  </div>

</div>


<script>

const boton = document.getElementById("microfono");
const estado = document.getElementById("estado");
const instruccion = document.getElementById("instruccion");

const canvas = document.getElementById("onda");
const ctx = canvas.getContext("2d");


let audioContext;
let analyser;
let dataArray;

let sistemaActivo = false;
let microfonoPreparado = false;
let nexoHablando = false;

let vozNexo = null;


/* =========================
   CANVAS
========================= */

function ajustarCanvas() {

  canvas.width =
    canvas.clientWidth * devicePixelRatio;

  canvas.height =
    canvas.clientHeight * devicePixelRatio;
}

ajustarCanvas();

window.addEventListener(
  "resize",
  ajustarCanvas
);


/* =========================
   ONDA
========================= */

function dibujarOnda() {

  requestAnimationFrame(dibujarOnda);

  const ancho = canvas.width;
  const alto = canvas.height;

  ctx.clearRect(0, 0, ancho, alto);

  ctx.beginPath();

  ctx.lineWidth =
    3 * devicePixelRatio;


  if (
    !sistemaActivo ||
    !analyser
  ) {

    ctx.strokeStyle = "#4aaeff";

    ctx.moveTo(0, alto / 2);
    ctx.lineTo(ancho, alto / 2);

    ctx.stroke();

    return;
  }


  analyser.getByteTimeDomainData(
    dataArray
  );


  ctx.strokeStyle =
    nexoHablando
      ? "#f3c969"
      : "#54d9ff";


  const slice =
    ancho / dataArray.length;

  let x = 0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    const v =
      dataArray[i] / 128;

    const y =
      v * alto / 2;


    if (i === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);
    }


    x += slice;
  }


  ctx.stroke();
}


/* =========================
   MICRÓFONO
========================= */

async function prepararMicrofono() {

  if (microfonoPreparado) {
    return true;
  }


  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    analyser =
      audioContext.createAnalyser();


    analyser.fftSize = 2048;


    const source =
      audioContext
        .createMediaStreamSource(
          stream
        );


    source.connect(analyser);


    dataArray =
      new Uint8Array(
        analyser.fftSize
      );


    microfonoPreparado = true;

    return true;


  } catch (error) {

    estado.textContent =
      "MICRÓFONO NO DISPONIBLE";

    instruccion.textContent =
      "Revisa el permiso del navegador";

    return false;
  }
}


/* =========================
   VOZ
========================= */

function cargarVoces() {

  const voces =
    window.speechSynthesis
      .getVoices();


  vozNexo =
    voces.find(
      v =>
        v.lang
          .toLowerCase()
          .includes("es-mx")
    );


  if (!vozNexo) {

    vozNexo =
      voces.find(
        v =>
          v.lang
            .toLowerCase()
            .startsWith("es")
      );
  }


  console.log(
    "Voz NEXO:",
    vozNexo
  );
}


cargarVoces();


window.speechSynthesis.onvoiceschanged =
  cargarVoces;


/* =========================
   EN ESPERA
========================= */

function mostrarEspera() {

  if (!sistemaActivo) {
    return;
  }


  estado.textContent =
    "EN ESPERA";


  instruccion.textContent =
    'Di "Oye Nexo" seguido de tu pregunta';
}


/* =========================
   HABLAR
========================= */

function hablar(texto) {

  if (
    !("speechSynthesis" in window)
  ) {

    estado.textContent =
      "VOZ NO DISPONIBLE";

    return;
  }


  nexoHablando = true;


  /*
    APAGAMOS EL OÍDO
    MIENTRAS NEXO HABLA
  */

  try {

    reconocimiento.abort();

  } catch (error) {}


  /*
    MOSTRAMOS RESPONDIENDO
    ANTES DE PEDIR LA VOZ
  */

  estado.textContent =
    "RESPONDIENDO";


  instruccion.textContent =
    "NEXO está hablando";


  window.speechSynthesis.cancel();

  window.speechSynthesis.resume();


  const mensaje =
    new SpeechSynthesisUtterance(
      texto
    );


  mensaje.lang =
    "es-MX";

  mensaje.rate =
    0.95;

  mensaje.pitch =
    1;

  mensaje.volume =
    1;


  if (vozNexo) {

    mensaje.voice =
      vozNexo;
  }


  mensaje.onstart = () => {

    console.log(
      "NEXO comenzó a hablar"
    );
  };


  mensaje.onend = () => {

    console.log(
      "NEXO terminó de hablar"
    );


    nexoHablando = false;


    setTimeout(() => {

      mostrarEspera();

      reiniciarEscucha();

    }, 800);
  };


  mensaje.onerror = (event) => {

    console.log(
      "Error de voz:",
      event.error
    );


    nexoHablando = false;


    estado.textContent =
      "ERROR DE VOZ";


    instruccion.textContent =
      "No pude reproducir la voz";
  };


  /*
    PEQUEÑA PAUSA DESPUÉS
    DE CANCELAR LA VOZ ANTERIOR
  */

  setTimeout(() => {

    window.speechSynthesis.speak(
      mensaje
    );

  }, 150);
}


/* =========================
   RECONOCIMIENTO
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let reconocimiento;


if (SpeechRecognition) {

  reconocimiento =
    new SpeechRecognition();


  reconocimiento.lang =
    "es-MX";


  reconocimiento.continuous =
    false;


  reconocimiento.interimResults =
    false;


  reconocimiento.maxAlternatives =
    1;



  reconocimiento.onresult =
    (event) => {


      if (nexoHablando) {
        return;
      }


      const textoOriginal =
        event.results[0][0]
          .transcript;


      const texto =
        textoOriginal
          .toLowerCase()
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          );


      console.log(
        "Escuché:",
        textoOriginal
      );


      const posicion =
        texto.indexOf("nexo");


      /*
        SI NO DIJO NEXO:
        IGNORAR
      */

      if (posicion === -1) {

        mostrarEspera();

        return;
      }


      /*
        SACAR LA PREGUNTA
        DESPUÉS DE NEXO
      */

      let pregunta =
        textoOriginal
          .substring(
            posicion + 4
          )
          .replace(
            /^[\s,.:;!?¿¡-]+/,
            ""
          )
          .trim();


      if (
        pregunta.length < 3
      ) {

        estado.textContent =
          "TE ESCUCHO";


        instruccion.textContent =
          'Di "Nexo" seguido de tu pregunta';

        return;
      }


      estado.textContent =
        "PREGUNTA RECIBIDA";


      instruccion.textContent =
        "Preparando respuesta";


      /*
        RESPUESTA DE PRUEBA
      */

      setTimeout(() => {

        hablar(
          "He recibido tu pregunta. Estoy listo para consultar mis fuentes."
        );

      }, 400);
    };



  reconocimiento.onerror =
    (event) => {


      if (
        event.error ===
          "no-speech" ||
        event.error ===
          "aborted"
      ) {

        return;
      }


      console.log(
        "Error reconocimiento:",
        event.error
      );
    };



  reconocimiento.onend =
    () => {


      if (
        !sistemaActivo ||
        nexoHablando
      ) {

        return;
      }


      setTimeout(
        reiniciarEscucha,
        500
      );
    };
}


/* =========================
   REINICIAR ESCUCHA
========================= */

function reiniciarEscucha() {

  if (
    !sistemaActivo ||
    nexoHablando
  ) {

    return;
  }


  try {

    reconocimiento.start();

  } catch (error) {}
}


/* =========================
   BOTÓN
========================= */

boton.addEventListener(
  "click",
  async () => {


    /*
      APAGAR
    */

    if (sistemaActivo) {

      sistemaActivo = false;

      nexoHablando = false;


      window.speechSynthesis
        .cancel();


      try {

        reconocimiento.abort();

      } catch (error) {}


      estado.textContent =
        "EN ESPERA";


      instruccion.textContent =
        "Toca el micrófono para comenzar";


      return;
    }


    /*
      ACTIVAR
    */

    estado.textContent =
      "PREPARANDO…";


    instruccion.textContent =
      "Activando NEXO";


    const preparado =
      await prepararMicrofono();


    if (!preparado) {
      return;
    }


    if (!SpeechRecognition) {

      estado.textContent =
        "RECONOCIMIENTO NO DISPONIBLE";

      return;
    }


    /*
      DESPERTAMOS EL MOTOR DE VOZ
      DESDE EL CLIC DEL USUARIO
    */

    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();


    const despertar =
      new SpeechSynthesisUtterance(
        "Nexo activado"
      );


    despertar.lang =
      "es-MX";


    if (vozNexo) {

      despertar.voice =
        vozNexo;
    }


    sistemaActivo = true;


    despertar.onend = () => {

      mostrarEspera();

      reiniciarEscucha();
    };


    despertar.onerror = () => {

      mostrarEspera();

      reiniciarEscucha();
    };


    window.speechSynthesis.speak(
      despertar
    );

  }
);


dibujarOnda();

</script>

</body>
</html>
